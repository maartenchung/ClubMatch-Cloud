<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>.hidden{display:none!important}.badge{padding:2px 5px}.card{padding:8px}.lafPitch{position:relative}.lafOwn,.lafOpp{position:absolute}</style></head><body>
<div id="v08LiveActionFieldHost"></div><div id="result">RUNNING</div>
<script>
const rpcLog=[];
const client={rpc:async(name,params)=>{rpcLog.push({name,params});return {data:{ok:true,event_id:'e-'+rpcLog.length,client_event_id:params?.p_client_event_id||null}}}};
window.ClubMatchV08CloudClient={createClient:()=>client};
const runtime={activeMatchId:'m1',snapshot:null,realtimeConnected:false,refresh:async()=>runtime.snapshot,waitForClientEvent:async()=>runtime.snapshot,recordGoal:async input=>{rpcLog.push({name:'runtime_goal',params:input});return {ok:true}},recordPenalty:async input=>{rpcLog.push({name:'runtime_penalty',params:input});return {ok:true}}};
</script>
<script src="../pitch-layout.js"></script><script src="../action-context-model-v08.js"></script><script src="../action-context-persistence-v08.js"></script><script src="../event-describer.js"></script><script src="../live-input-event-describer-v08.js"></script><script src="../player-action-controller-v10.js"></script><script src="../live-action-field-v13.js"></script><script src="../action-context-ui-v08.js"></script>
<script>
const players=[{player_id:'p1',display_name:'Wai Sam',shirt_number:13,selected:true,is_on_field:true,current_position:'RW',starting_position:'RW'},{player_id:'p2',display_name:'Maxim',shirt_number:9,selected:true,is_on_field:true,current_position:'ST',starting_position:'ST'}];
const snap={match:{id:'m1',status:'live',formation_code:'4-3-3',opponent_formation_code:'4-3-3',score_for:0,score_against:0},state:{clock_status:'running',period:'first_half',effective_elapsed_seconds:900},players,events:[]};runtime.snapshot=snap;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
window.dispatchEvent(new CustomEvent('clubmatch:v08-runtime-ready',{detail:{runtime}}));window.dispatchEvent(new CustomEvent('clubmatch:v08-confirmed',{detail:{runtime,snapshot:snap}}));
setTimeout(async()=>{try{
 const panel=document.getElementById('v08LiveActionField');if(!panel||panel.classList.contains('hidden'))throw new Error('Live Actieveld ontbreekt');
 const own=panel.querySelector('[data-player-id="p1"]'),opp=panel.querySelector('[data-opp-id="T1"]');if(!own||!opp)throw new Error('veldspelers/tegenstander ontbreken');
 own.click();await wait(20);opp.click();await wait(30);
 const pending=window.ClubMatchV08ActionContextBridge.pendingChoice;if(!pending||pending.type!=='loss')throw new Error('A→T classificatie niet geopend');
 const ctxBtn=document.querySelector('[data-cm-context]');if(!ctxBtn||ctxBtn.disabled)throw new Error('context vóór classificatie niet beschikbaar');ctxBtn.click();await wait(10);
 const choose=(key,value)=>{const b=document.querySelector(`[data-key="${key}"][data-value="${value}"]`);if(!b)throw new Error(`contextoptie ${key}=${value} ontbreekt`);b.click()};
 choose('pressure','heavy_pressure');choose('passing_options','none');choose('phase','transition');await wait(30);
 const before=window.ClubMatchV08ActionContextBridge.pendingChoice?.context||{};if(before.pressure!=='heavy_pressure'||before.passing_options!=='none'||before.phase!=='transition')throw new Error('meervoudige context vóór classificatie niet bewaard');
 const poor=document.querySelector('[data-loss="poor_control"]');if(!poor)throw new Error('Slechte controle keuze ontbreekt');poor.click();await wait(100);
 const draft=window.ClubMatchV08ActionContextBridge.lastDraft;if(!draft||draft.action!=='ball_loss'||draft.context?.result!=='poor_control')throw new Error('poor_control draft niet correct');if(draft.context.pressure!=='heavy_pressure'||draft.context.passing_options!=='none'||draft.context.phase!=='transition')throw new Error('context verloren bij classificatie');
 const contextCall=[...rpcLog].reverse().find(x=>x.name==='upsert_match_event_context_v09'&&x.params?.p_client_event_id===draft.clientEventId);if(!contextCall)throw new Error('v09 context upsert ontbreekt');const payload=contextCall.params.p_context||{};if(payload.context_version!==1||payload.pressure!=='heavy_pressure'||payload.passing_options!=='none'||payload.result!=='poor_control')throw new Error('context payload top-level incompleet');if(payload.action_context?.phase!=='transition'||payload.action_context?.result!=='poor_control')throw new Error('action_context incompleet');
 const primary=rpcLog.find(x=>x.name==='record_analyst_action_v08'&&x.params?.p_client_event_id===draft.clientEventId);if(!primary)throw new Error('primaire balverliesactie met dezelfde client_event_id ontbreekt');if(primary.params.p_cause!=='poor_control')throw new Error('primaire cause is niet poor_control');
 const described=window.ClubMatchV08EventDescriber.describeEvent({event_type:'player_action',subject_player_id:'p1',payload:{action:'ball_loss',cause:'poor_control',context_version:1,pressure:'heavy_pressure',passing_options:'none',result:'poor_control',action_context:{pressure:'heavy_pressure',passing_options:'none',phase:'transition',result:'poor_control'}}},{p1:{display_name:'Wai Sam',shirt_number:13}});for(const text of ['Balverlies','slechte controle','Context:','zware druk','geen afspeelmogelijkheid','omschakeling'])if(!described.description.toLowerCase().includes(text.toLowerCase()))throw new Error('gebeurtenis mist '+text+': '+described.description);
 document.getElementById('result').textContent='CONTEXT_1700_PASS';
}catch(e){document.getElementById('result').textContent='CONTEXT_1700_FAIL '+e.message}},100);
</script></body></html>
