<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>.hidden{display:none!important}.card{padding:8px}.lafPitch{position:relative}.lafOwn,.lafOpp{position:absolute}</style></head><body><div id="v08LiveActionFieldHost"></div><div id="result">RUNNING</div>
<script>
const rpcLog=[];const client={rpc:async(name,params)=>{rpcLog.push({name,params});return {data:{ok:true,event_id:'e'+rpcLog.length}}}};window.ClubMatchV08CloudClient={createClient:()=>client};const runtime={activeMatchId:'m1',snapshot:null,realtimeConnected:false,refresh:async()=>runtime.snapshot,waitForClientEvent:async()=>runtime.snapshot,recordGoal:async()=>({ok:true}),recordPenalty:async()=>({ok:true})};const wait=ms=>new Promise(r=>setTimeout(r,ms));
</script><script src="../pitch-layout.js"></script><script src="../action-context-model-v08.js"></script><script src="../action-context-persistence-v08.js"></script><script src="../player-action-controller-v10.js"></script><script src="../live-action-field-v13.js"></script>
<script>
const mk=(id,name,n,pos,on)=>({player_id:id,display_name:name,shirt_number:n,selected:true,is_on_field:on,current_position:on?pos:null,starting_position:pos,accumulated_play_seconds:600,accumulated_bench_seconds:120,state_changed_elapsed_seconds:600});
const base={match:{id:'m1',status:'live',formation_code:'4-3-3',opponent_formation_code:'4-3-3'},state:{clock_status:'running',period:'first_half',effective_elapsed_seconds:1200},events:[]};
let snap={...base,players:[mk('p1','Wai Sam',13,'RB',true),mk('p2','Luuk',8,'CM',true),mk('p3','Gast',17,'RW',false)]};runtime.snapshot=snap;window.dispatchEvent(new CustomEvent('clubmatch:v08-runtime-ready',{detail:{runtime}}));window.dispatchEvent(new CustomEvent('clubmatch:v08-confirmed',{detail:{runtime,snapshot:snap}}));
setTimeout(async()=>{try{const panel=document.getElementById('v08LiveActionField');if(!panel||panel.classList.contains('hidden'))throw new Error('actieveld niet zichtbaar');if(!panel.querySelector('[data-player-id="p2"]'))throw new Error('Luuk initieel ontbreekt');
 snap={...base,players:[mk('p1','Wai Sam',13,'RB',true),mk('p2','Luuk',8,'CM',false),mk('p3','Gast',17,'RW',true)]};runtime.snapshot=snap;window.dispatchEvent(new CustomEvent('clubmatch:v08-confirmed',{detail:{runtime,snapshot:snap}}));await wait(40);if(panel.querySelector('[data-player-id="p2"]'))throw new Error('uitgewisselde Luuk bleef als tegel staan');if(!panel.querySelector('[data-player-id="p3"]'))throw new Error('ingewisselde gastspeler niet toegevoegd');
 snap={...base,players:[mk('p1','Wai Sam',13,'RB',true),mk('p2','Luuk',8,'CM',true),mk('p3','Gast',17,'RW',false)]};runtime.snapshot=snap;window.dispatchEvent(new CustomEvent('clubmatch:v08-confirmed',{detail:{runtime,snapshot:snap}}));await wait(40);const luuk=panel.querySelector('[data-player-id="p2"]');if(!luuk)throw new Error('Luuk kwam na terugwissel niet terug');luuk.click();await wait(20);if(window.ClubMatchV13LiveActionField.state.lastOwn?.id!=='p2')throw new Error('teruggekeerde Luuk niet aanklikbaar');
 const wai=panel.querySelector('[data-player-id="p1"]');wai.click();await wait(20);const pitch=document.getElementById('lafPitch'),r=pitch.getBoundingClientRect();pitch.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,clientX:r.left+r.width*.86,clientY:r.top+r.height*.24}));await wait(20);const point=window.ClubMatchV13LiveActionField.state.manualActionPoint;if(!point||point.x<80||point.y>30)throw new Error('lege veldtik maakt geen actiepositie op mobiel/desktop');panel.querySelector('[data-action="cross"]').click();await wait(50);const cross=[...rpcLog].reverse().find(x=>x.name==='record_action_field_event_v08'&&x.params?.p_action==='cross');if(!cross)throw new Error('voorzet vanaf actiepositie niet opgeslagen');if(cross.params.p_start_x<80||cross.params.p_start_y>30)throw new Error('actiepositie niet gekoppeld aan voorzet');document.getElementById('result').textContent='LIVE_FIELD_1800_PASS';}catch(e){document.getElementById('result').textContent='LIVE_FIELD_1800_FAIL '+e.message}},120);
</script></body></html>
