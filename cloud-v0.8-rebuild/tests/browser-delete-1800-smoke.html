<!doctype html><html><head><meta charset="utf-8"></head><body><button id="refreshMatchesBtn">refresh</button><div id="openMatches"></div><div class="libBox"><h3>Wedstrijdhistorie</h3><div class="libRow" data-lib-history="m1"><div><b>Test 1</b></div><div><button data-delete-history>delete</button></div></div><div class="libRow" data-lib-history="m2"><div><b>Test 2</b></div><div><button data-delete-history>delete</button></div></div></div><div id="result">RUNNING</div><script>
const existing=new Set(['m1','m2']);let refreshes=0,loads=0,confirms=0;const log=[];window.confirm=()=>{confirms++;return true};window.prompt=()=>"DELETE";document.getElementById('refreshMatchesBtn').onclick=()=>refreshes++;const fake={rpc:async(name,params)=>{log.push({name,params});if(name==='delete_match_v08'){existing.delete(params.p_match_id);return {data:{ok:true,deleted_match_id:params.p_match_id}}}if(name==='get_my_match_library_v08')return {data:[...existing].map(match_id=>({match_id}))};return {data:[]}}};window.ClubMatchV08CloudClient={createClient:()=>fake};window.ClubMatchV08MatchLibraryApp={client:fake,ui:{load:async()=>{loads++;return[...existing]}}};
</script><script src="../stored-match-delete-ui.js"></script><script src="../bulk-history-delete-v08.js"></script><script>
setTimeout(async()=>{try{const selectAll=document.querySelector('[data-cm-select-all]');if(!selectAll)throw new Error('bulk toolbar ontbreekt');selectAll.click();const selected=[...document.querySelectorAll('[data-cm-history-select]:checked')];if(selected.length!==2)throw new Error('niet beide wedstrijden geselecteerd');document.querySelector('[data-cm-bulk-delete]').click();await new Promise(r=>setTimeout(r,1100));if(existing.size!==0)throw new Error('bulk delete rpc verwijderde niet beide wedstrijden');if(log.filter(x=>x.name==='delete_match_v08').length!==2)throw new Error('verwacht twee delete rpc calls');if(confirms!==1)throw new Error('bulk verwijderen moet één bevestiging gebruiken');if(document.querySelector('[data-lib-history="m1"],[data-lib-history="m2"]'))throw new Error('historierijen bleven zichtbaar');if(refreshes<1)throw new Error('open wedstrijden niet ververst');if(loads<1)throw new Error('historie niet opnieuw geladen');document.getElementById('result').textContent='DELETE_1800_PASS'}catch(e){document.getElementById('result').textContent='DELETE_1800_FAIL '+e.message}},180);
</script></body></html>
