<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<div id="v08LiveActionFieldHost"></div><main id="appPanel"><section data-workspace-persistent></section></main><div id="result">RUNNING</div>
<script>
const rpcLog=[];let delayedResolve=null;const delayed=new Promise(resolve=>{delayedResolve=resolve});
const client={rpc:async(name,params)=>{rpcLog.push({name,params});if(name==='record_action_field_event_v08'&&params?.p_action==='cross')return delayed;return {data:{ok:true,event_id:'e-'+rpcLog.length}}}};
window.ClubMatchV08CloudClient={createClient:()=>client};
const runtime={activeMatchId:'m1',snapshot:null,realtimeConnected:false,refresh:async()=>runtime.snapshot,waitForClientEvent:async()=>runtime.snapshot,recordGoal:async(input)=>{rpcLog.push({name:'runtime_goal',params:input});return {ok:true}},recordPenalty:async(input)=>{rpcLog.push({name:'runtime_penalty',params:input});return {ok:true}}};
</script>
<script src="../pitch-layout.js"></script><script src="../action-context-model-v08.js"></script><script src="../action-context-persistence-v08.js"></script><script src="../player-action-controller-v10.js"></script><script src="../live-action-field-v11.js"></script><script src="../action-context-ui-v08.js"></script>
<script>
const ps=[{player_id:'p1',display_name:'Wai Sam',shirt_number:13,selected:true,is_on_field:true,current_position:'RW',starting_position:'RW'},{player_id:'p2',display_name:'B',shirt_number:8,selected:true,is_on_field:true,current_position:'ST',starting_position:'ST'}];
const snap={match:{id:'m1',status:'live',formation_code:'4-3-3',opponent_formation_code:'4-3-3',score_for:0,score_against:0},state:{clock_status:'running',period:'first_half',effective_elapsed_seconds:1200},players:ps,events:[]};runtime.snapshot=snap;
window.dispatchEvent(new CustomEvent('clubmatch:v08-runtime-ready',{detail:{runtime}}));window.dispatchEvent(new CustomEvent('clubmatch:v08-confirmed',{detail:{runtime,snapshot:snap}}));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
setTimeout(async()=>{try{
 const panel=document.getElementById('v08LiveActionField');if(!panel||panel.classList.contains('hidden'))throw new Error('Live Actieveld niet zichtbaar');
 const fieldRow=document.querySelector('.cmCtxFieldRow'),rail=document.getElementById('cmCtxRail'),mobile=window.innerWidth<=600;if(!fieldRow||!rail)throw new Error('context veld-layout ontbreekt');if(!mobile&&fieldRow.children[1]!==rail)throw new Error('desktop/tablet context staat niet rechts van veld');if(mobile&&getComputedStyle(rail).order!=='-1')throw new Error('mobiele contextbalk staat niet compact boven veld');
 const p1=panel.querySelector('[data-player-id="p1"]');p1.click();await wait(20);const before=performance.now();panel.querySelector('[data-action="cross"]').click();await wait(0);const elapsed=performance.now()-before,draft=window.ClubMatchV08ActionContextBridge.lastDraft;if(!draft||draft.action!=='cross'||elapsed>100)throw new Error('directe cross registratie faalt');if(!document.querySelector('.cmCtxMarker'))throw new Error('actiemarker ontbreekt');
 p1.click();await wait(10);panel.querySelector('[data-opp-id="T1"]').click();await wait(30);const guide=document.getElementById('lafGuide');if(!guide.closest('[data-guide-slot="duel"]'))throw new Error('A→T keuze staat niet bij Duels & balverlies');for(const x of ['Pass onderschept','Duel verloren','Slechte controle'])if(!guide.textContent.includes(x))throw new Error('A→T keuze ontbreekt '+x);
 const contextBtn=document.querySelector('[data-cm-context]');if(contextBtn.disabled)throw new Error('context is onterecht geblokkeerd vóór classificatie');contextBtn.click();await wait(10);const pressure=document.querySelector('[data-key="pressure"][data-value="pressure"]'),phase=document.querySelector('[data-key="phase"][data-value="transition"]');if(!pressure||!phase)throw new Error('pending context opties ontbreken');pressure.click();phase.click();await wait(20);if(!window.ClubMatchV08ActionContextBridge.pendingChoice?.context?.pressure||!window.ClubMatchV08ActionContextBridge.pendingChoice?.context?.phase)throw new Error('meerdere contextcategorieën niet bewaard');
 guide.querySelector('[data-loss="bad_pass"]').click();await wait(30);const classified=window.ClubMatchV08ActionContextBridge.lastDraft;if(classified.context.pressure!=='pressure'||classified.context.phase!=='transition')throw new Error('context niet meegenomen naar classificatie');
 p1.click();await wait(10);const gainGuide=document.getElementById('lafGuide');if(!gainGuide.closest('[data-guide-slot="defense"]'))throw new Error('T→A keuze staat niet bij Balwinst & verdediging');gainGuide.querySelector('[data-gain="ball_recovery"]').click();await wait(30);
 p1.click();await wait(10);panel.querySelector('[data-action="penalty"]').click();await wait(10);const penalty=document.querySelector('.lafPenaltyDecision');if(!penalty)throw new Error('penalty tegelkeuzes ontbreken');for(const cls of ['scored','missed','saved','cancel'])if(!penalty.querySelector('.'+cls))throw new Error('penalty kleurtegel ontbreekt '+cls);penalty.querySelector('.missed').click();await wait(20);const penLog=rpcLog.findLast?.(x=>x.name==='runtime_penalty')||[...rpcLog].reverse().find(x=>x.name==='runtime_penalty');if(!penLog||penLog.params.outcome!=='missed'||penLog.params.note!==null)throw new Error('penalty event bevat verkeerde uitkomst/interne note');
 const loc=document.querySelector('[data-cm-location]');if(!loc||loc.disabled)throw new Error('locatiecorrectie niet beschikbaar na event');loc.click();await wait(5);if(mobile&&!document.querySelector('.cmCtxFullscreen'))throw new Error('mobiel fullscreen locatieveld ontbreekt');if(!mobile&&document.querySelector('.cmCtxFullscreen'))throw new Error('desktop/tablet kreeg fullscreen locatieveld');
 document.getElementById('result').textContent=`CONTEXT_SMOKE_PASS width=${window.innerWidth} mobile=${mobile} elapsed=${elapsed.toFixed(1)}`;
}catch(e){document.getElementById('result').textContent='CONTEXT_SMOKE_FAIL '+e.message}},100);
</script></body></html>
