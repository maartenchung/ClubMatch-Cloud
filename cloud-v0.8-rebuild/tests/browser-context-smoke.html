<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<div id="v08LiveActionFieldHost"></div><main id="appPanel"><section data-workspace-persistent></section></main><div id="result">RUNNING</div>
<script>
const rpcLog=[];let delayedResolve=null;
const delayed=new Promise(resolve=>{delayedResolve=resolve});
const client={rpc:async(name,params)=>{rpcLog.push({name,params});if(name==='record_action_field_event_v08'&&params?.p_action==='cross')return delayed;return {data:{ok:true,event_id:'e-'+rpcLog.length}}}};
window.ClubMatchV08CloudClient={createClient:()=>client};
const runtime={activeMatchId:'m1',snapshot:null,realtimeConnected:false,refresh:async()=>runtime.snapshot,waitForClientEvent:async()=>runtime.snapshot,recordGoal:async()=>({ok:true}),recordPenalty:async()=>({ok:true})};
</script>
<script src="../pitch-layout.js"></script><script src="../action-context-model-v08.js"></script><script src="../action-context-persistence-v08.js"></script><script src="../player-action-controller-v10.js"></script><script src="../live-action-field-v10.js"></script><script src="../action-context-ui-v08.js"></script>
<script>
const ps=[{player_id:'p1',display_name:'Wai Sam',shirt_number:13,selected:true,is_on_field:true,current_position:'RW',starting_position:'RW'},{player_id:'p2',display_name:'B',shirt_number:8,selected:true,is_on_field:true,current_position:'ST',starting_position:'ST'}];
const snap={match:{id:'m1',status:'live',formation_code:'4-3-3',opponent_formation_code:'4-3-3',score_for:0,score_against:0},state:{clock_status:'running',period:'first_half',effective_elapsed_seconds:1200},players:ps,events:[]};runtime.snapshot=snap;
window.dispatchEvent(new CustomEvent('clubmatch:v08-runtime-ready',{detail:{runtime}}));window.dispatchEvent(new CustomEvent('clubmatch:v08-confirmed',{detail:{runtime,snapshot:snap}}));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
setTimeout(async()=>{try{
 const panel=document.getElementById('v08LiveActionField');if(!panel||panel.classList.contains('hidden'))throw new Error('Live Actieveld niet zichtbaar');
 if(!panel.textContent.includes('speler → actie → klaar')||!panel.textContent.includes('Live Veldpositie ≠ Actiepositie'))throw new Error('context UX-regel ontbreekt');
 const p1=panel.querySelector('[data-player-id="p1"]');if(!p1)throw new Error('spelertegel ontbreekt');p1.click();await wait(30);
 const before=performance.now();panel.querySelector('[data-action="cross"]').click();await wait(0);const elapsed=performance.now()-before;
 const draft=window.ClubMatchV08ActionContextBridge.lastDraft;if(!draft||draft.action!=='cross')throw new Error('cross draft niet direct lokaal aangemaakt');if(elapsed>100)throw new Error('lokale actiefeedback te traag '+elapsed);
 if(!draft.start)throw new Error('automatische actiepositie ontbreekt');if(draft.tactical?.position!=='RW')throw new Error('tactische positie niet apart bewaard');
 if(panel.querySelector('#lafModal:not(.hidden)'))throw new Error('normale actie opende verplichte modal');
 if(!document.querySelector('.cmCtxMarker'))throw new Error('tijdelijke actiemarker ontbreekt');
 const originalTac=JSON.stringify(draft.tactical);window.ClubMatchV08ActionContextBridge.correctLocation({x:91,y:14},{x:55,y:8});await wait(10);const corrected=window.ClubMatchV08ActionContextBridge.lastDraft;if(corrected.start.x!==91||corrected.start.y!==14)throw new Error('locatiecorrectie niet toegepast');if(JSON.stringify(corrected.tactical)!==originalTac)throw new Error('locatiecorrectie wijzigde tactische positie');
 p1.click();await wait(10);panel.querySelector('[data-opp-id="T1"]').click();await wait(10);const g=document.getElementById('lafGuide').textContent;for(const x of ['Pass onderschept','Duel verloren','Slechte controle'])if(!g.includes(x))throw new Error('A→T begeleide keuze ontbreekt '+x);
 const loc=document.querySelector('[data-cm-location]');if(!loc||loc.disabled)throw new Error('optionele locatieknop ontbreekt');loc.click();await wait(5);const mobile=window.innerWidth<=600;if(mobile&&!document.querySelector('.cmCtxFullscreen'))throw new Error('mobiel fullscreen locatieveld ontbreekt');if(!mobile&&document.querySelector('.cmCtxFullscreen'))throw new Error('desktop/tablet kreeg onnodig fullscreen veld');
 const layoutBefore=snap.players[0].current_position;window.ClubMatchV08ActionContextBridge.correctLocation({x:88,y:18});if(snap.players[0].current_position!==layoutBefore)throw new Error('actiepositie wijzigde live veldpositie');
 document.getElementById('result').textContent=`CONTEXT_SMOKE_PASS width=${window.innerWidth} mobile=${mobile} elapsed=${elapsed.toFixed(1)}`;
}catch(e){document.getElementById('result').textContent='CONTEXT_SMOKE_FAIL '+e.message}},100);
</script></body></html>
