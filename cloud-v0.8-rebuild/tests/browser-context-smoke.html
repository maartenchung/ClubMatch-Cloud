<div id="v08LiveActionFieldHost"></div><main id="appPanel"><section data-workspace-persistent></section></main><div id="result">RUNNING</div>
<script>

<script src="../pitch-layout.js"></script><script src="../action-context-model-v08.js"></script><script src="../action-context-persistence-v08.js"></script><script src="../event-describer.js"></script><script src="../live-input-event-describer-v08.js"></script><script src="../player-action-controller-v10.js"></script><script src="../live-action-field-v13.js"></script><script src="../action-context-ui-v08.js"></script>
<script>

setTimeout(async()=>{try{
 const panel=document.getElementById('v08LiveActionField');if(!panel||panel.classList.contains('hidden'))throw new Error('Live Actieveld niet zichtbaar');
 const fieldRow=document.querySelector('.cmCtxFieldRow'),rail=document.getElementById('cmCtxRail'),mobile=window.innerWidth<=600;if(!fieldRow||!rail)throw new Error('context veld-layout ontbreekt');if(!mobile&&fieldRow.children[1]!==rail)throw new Error('desktop/tablet context staat niet rechts van veld');if(mobile&&getComputedStyle(rail).order!=='-1')throw new Error('mobiele contextbalk staat niet compact boven veld');
 let p1=panel.querySelector('[data-player-id="p1"]');if(parseFloat(p1.style.left)!==77||parseFloat(p1.style.top)!==66)throw new Error('v11 indeling niet gemigreerd');if(!localStorage.getItem('clubmatch.v08.laf.layout.m1.for.p1'))throw new Error('stabiele layout key niet aangemaakt');window.dispatchEvent(new CustomEvent('clubmatch:v08-confirmed',{detail:{runtime,snapshot:snap}}));await wait(20);p1=panel.querySelector('[data-player-id="p1"]');if(parseFloat(p1.style.left)!==77||parseFloat(p1.style.top)!==66)throw new Error('indeling niet behouden na refresh/render');
 if(mobile){const r=p1.getBoundingClientRect();if(r.width>76||r.height>46)throw new Error(`mobiele tegel te groot ${r.width.toFixed(1)}x${r.height.toFixed(1)}`)}

 p1.click();await wait(20);const before=performance.now();panel.querySelector('[data-action="cross"]').click();await wait(0);const elapsed=performance.now()-before,draft=window.ClubMatchV08ActionContextBridge.lastDraft;if(!draft||draft.action!=='cross'||elapsed>100)throw new Error('directe cross registratie faalt');if(!document.querySelector('.cmCtxMarker'))throw new Error('actiemarker ontbreekt');delayedResolve({data:{ok:true,event_id:'cross'}});await wait(30);
 p1.click();await wait(10);panel.querySelector('[data-opp-id="T1"]').click();await wait(30);const guide=document.getElementById('lafGuide'),lossGroup=guide.closest('[data-group="duel"]');if(!lossGroup)throw new Error('A→T keuze staat niet bij Duels & balverlies');if(!lossGroup.classList.contains('guided'))throw new Error('A→T categorie niet in guided modus');if(getComputedStyle(lossGroup.querySelector('.lafGroupButtons')).display!=='none')throw new Error('dubbele normale duelknoppen blijven zichtbaar');for(const x of ['Pass onderschept','Duel verloren','Slechte controle'])if(!guide.textContent.includes(x))throw new Error('A→T keuze ontbreekt '+x);

 document.getElementById('result').textContent=`CONTEXT_SMOKE_PASS width=${window.innerWidth} mobile=${mobile} elapsed=${elapsed.toFixed(1)} refresh=${refreshCount}`;
}catch(e){document.getElementById('result').textContent='CONTEXT_SMOKE_FAIL '+e.message}},100);
