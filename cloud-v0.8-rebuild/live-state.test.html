<!doctype html><meta charset="utf-8"><title>ClubMatch v0.8 state tests</title><script src="live-state.js"></script><pre id="out"></pre><script>
const ids=Array.from({length:15},(_,i)=>'p'+(i+1));const starters=ids.slice(0,11);const pos={};starters.forEach((id,i)=>pos[id]='POS'+(i+1));
const tests=[];function t(name,fn){try{fn();tests.push('PASS '+name)}catch(e){tests.push('FAIL '+name+' — '+e.message)}}function eq(a,b,m){if(JSON.stringify(a)!==JSON.stringify(b))throw Error(m+` (${JSON.stringify(a)} != ${JSON.stringify(b)})`)}function state(events,now=2400){return ClubMatchV08.deriveLiveMatchState({selectedIds:ids,starterIds:starters,startingPositionsById:pos,events,effectiveMatchSecond:now})}
t('start has 11 field',()=>eq(state([],0).fieldIds.length,11,'field count'));
t('first substitution',()=>{const s=state([{type:'SUBSTITUTION',outId:'p1',inId:'p12',position:'POS1',matchSecond:600,seq:1}]);eq(s.players.p1.currentRole,'BENCH','p1');eq(s.players.p12.currentRole,'FIELD','p12');eq(s.players.p1.playSeconds,600,'p1 play');eq(s.players.p12.playSeconds,1800,'p12 play')});
t('second substitution without refresh',()=>{const s=state([{type:'SUBSTITUTION',outId:'p1',inId:'p12',position:'POS1',matchSecond:600,seq:1},{type:'SUBSTITUTION',outId:'p2',inId:'p13',position:'POS2',matchSecond:900,seq:2}]);eq(s.fieldIds.length,11,'11');eq(s.players.p13.currentRole,'FIELD','p13')});
t('third substitution player can return',()=>{const s=state([{type:'SUBSTITUTION',outId:'p1',inId:'p12',position:'POS1',matchSecond:600,seq:1},{type:'SUBSTITUTION',outId:'p2',inId:'p13',position:'POS2',matchSecond:900,seq:2},{type:'SUBSTITUTION',outId:'p12',inId:'p1',position:'POS1',matchSecond:1200,seq:3}]);eq(s.players.p1.currentRole,'FIELD','p1 back');eq(s.players.p1.playSeconds,1800,'p1 total play');eq(s.players.p1.benchSeconds,600,'p1 bench')});
t('position change persists',()=>{const s=state([{type:'POSITION_CHANGED',playerId:'p3',position:'RW',matchSecond:300,seq:1}]);eq(s.players.p3.currentPosition,'RW','position')});
t('all players play+bench equals clock',()=>{const s=state([{type:'SUBSTITUTION',outId:'p1',inId:'p12',position:'POS1',matchSecond:601,seq:1},{type:'SUBSTITUTION',outId:'p2',inId:'p13',position:'POS2',matchSecond:919,seq:2}],2427);Object.values(s.players).forEach(p=>eq(p.playSeconds+p.benchSeconds,2427,p.playerId))});
document.getElementById('out').textContent=tests.join('\n')+'\n\n'+(tests.every(x=>x.startsWith('PASS'))?'ALL CORE TESTS PASS':'CORE TEST FAILURE');
</script>
