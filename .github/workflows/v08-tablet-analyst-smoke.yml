name: ClubMatch v0.8 analyst device smoke

on:
  push:
    branches:
      - clubmatch-v0.8-rebuild
    paths:
      - 'cloud-v0.8-rebuild/**'
      - '.github/workflows/v08-tablet-analyst-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'cloud-v0.8-rebuild/**'
      - '.github/workflows/v08-tablet-analyst-smoke.yml'

permissions:
  contents: read

jobs:
  analyst-device-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloud-v0.8-rebuild
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Live Match Workspace fixture
        run: |
          cat > _analyst-device-smoke.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>.hidden{display:none!important}.card{padding:10px;margin:4px}.liveLayout{display:grid;grid-template-columns:1fr 1fr}</style></head><body>
          <main id="appPanel">
            <section id="v08ScoreCard" class="card"><div id="v08PossessionBar"><div class="flowGrid" id="fixtureFlow"></div></div></section>
            <div class="liveLayout"><div>
              <section class="card"><h2>Live veldopstelling</h2><div id="v08Pitch"></div></section>
              <section class="card"><h2>Live monitoring</h2><div id="v08Monitor"></div></section>
              <section class="card" id="fixtureEventsCard"><h2>Gebeurtenissen</h2><div id="v08Timeline"></div></section>
            </div><div>
              <section class="card" id="fixtureFieldCard"><h2>Veldspelers</h2><div id="v08FieldTiles"></div></section>
              <section class="card" id="fixtureBenchCard"><h2>Bankspelers</h2><div id="v08BenchTiles"></div></section>
            </div></div>
          </main>
          <script>localStorage.setItem('clubmatch.v08.action.mode','analyst');</script>
          <script src="cloud-client.js"></script>
          <script src="pitch-layout.js"></script>
          <script src="player-action-controller.js"></script>
          <script src="live-match-workspace-v08.js"></script>
          <script src="analyst-live-input-v08.js"></script>
          <script>
          document.addEventListener('DOMContentLoaded',()=>{
            let goalSaved=false;
            const runtime={activeMatchId:'device-smoke',snapshot:null,refresh:async()=>{},recordGoal:async input=>{goalSaved=!!input?.scorerId;document.documentElement.dataset.lafGoalSaved=goalSaved?'ok':'fail';return {ok:true}}};
            const positions=['LW','ST','RW','LCM','DM','RCM','LB','LCB','RCB','RB','GK'];
            const names=['Wai Sam','Matz','Kayden','Siem','Vigo','Ben','Shane','Dani','Boaz','Sem','Keeper'];
            const players=positions.map((position,index)=>({player_id:`p${index+1}`,shirt_number:index+1,display_name:names[index],full_name:names[index],selected:true,is_on_field:true,current_position:position,starting_position:position}));
            const snapshot={match:{id:'device-smoke',status:'live',formation_code:'4-3-3'},state:{clock_status:'paused',period:'first_half'},players,events:[]};runtime.snapshot=snapshot;
            const flow=document.getElementById('fixtureFlow');players.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='flowPlayer';b.dataset.flowPlayer=p.player_id;b.textContent=p.display_name;flow.appendChild(b)});
            window.ClubMatchV08PlayerActions.createPlayerActionController=()=>({setSnapshot(){},currentPossession(){return null},currentTeamPossession(){return {side:'for'}},analystReceiveBall:async()=>({ok:true}),analystRecord:async()=>({ok:true}),analystLoseBall:async()=>({ok:true}),startTeamPossession:async()=>({ok:true}),stopPossession:async()=>({ok:true}),stopAllPossession:async()=>({ok:true})});
            window.dispatchEvent(new CustomEvent('clubmatch:v08-runtime-ready',{detail:{runtime}}));window.dispatchEvent(new CustomEvent('clubmatch:v08-confirmed',{detail:{runtime,snapshot}}));window.ClubMatchV08LiveWorkspace?.applyQuickFormation?.();window.ClubMatchV08AnalystLiveInput?.render?.();
            setTimeout(()=>{
              window.ClubMatchV08AnalystLiveInput?.render?.();window.ClubMatchV08LiveWorkspace?.applyQuickFormation?.();
              const field=document.getElementById('v08LiveActionField'),own=[...(field?.querySelectorAll('.lafOwn')||[])],opp=[...(field?.querySelectorAll('.lafOpp')||[])],firstNode=own[0];
              own[0]?.click();own[1]?.click();opp[0]?.click();own[2]?.click();
              for(let i=0;i<28;i++){(i%2===0?own[(i+3)%own.length]:opp[(i+1)%opp.length])?.click()}
              const trailRanks=[...(field?.querySelectorAll('.lafTrailRank')||[])].map(el=>el.textContent.trim());
              const current=trailRanks[0]||'',last=trailRanks.at(-1)||'',previousOpp=opp.find(b=>b.querySelector('.lafSeq')?.textContent==='−1')?.querySelector('.lafSeq')?.textContent||'';
              window.dispatchEvent(new CustomEvent('clubmatch:v08-confirmed',{detail:{runtime,snapshot}}));window.ClubMatchV08AnalystLiveInput?.render?.();
              const stableNode=field?.querySelector('.lafOwn')===firstNode;
              snapshot.state.clock_status='running';window.dispatchEvent(new CustomEvent('clubmatch:v08-confirmed',{detail:{runtime,snapshot}}));window.ClubMatchV08AnalystLiveInput?.render?.();
              const runningOwn=[...(field?.querySelectorAll('.lafOwn')||[])];runningOwn[3]?.click();field?.querySelector('[data-laf-action="goal_for"]')?.click();const goalVisible=!field?.querySelector('#lafGoal')?.classList.contains('hidden');field?.querySelector('[data-goal-type="open_play"]')?.click();
              const workspace=document.getElementById('v08LiveMatchWorkspace'),host=document.getElementById('v08LiveActionFieldHost'),analystCol=document.getElementById('v08LiveAnalystColumn'),tileZone=document.getElementById('v08PlayerTileZone'),formed=[...document.querySelectorAll('#fixtureFlow .v08FormationPlayer')];
              document.documentElement.dataset.lafSmoke=field&&!field.classList.contains('hidden')&&own.length===11&&opp.length===11?'ok':'fail';
              document.documentElement.dataset.lafTrailCurrent=current;document.documentElement.dataset.lafTrailLast=last;document.documentElement.dataset.lafTrailCount=String(trailRanks.length);document.documentElement.dataset.lafOpponentOrder=previousOpp==='−1'?'ok':'fail';document.documentElement.dataset.lafStable=stableNode?'ok':'fail';document.documentElement.dataset.lafGoalPanel=goalVisible?'ok':'fail';document.documentElement.dataset.lafWorkspace=workspace&&field?.parentElement===host&&document.getElementById('fixtureEventsCard')?.parentElement===analystCol&&document.getElementById('fixtureFieldCard')?.parentElement===tileZone&&document.getElementById('fixtureBenchCard')?.parentElement===tileZone?'ok':'fail';document.documentElement.dataset.lafFormation=formed.length===11&&formed.every(b=>b.style.left&&b.style.top)?'ok':'fail';document.documentElement.dataset.lafWidth=String(field?.getBoundingClientRect?.().width||0);
            },80);
          },{once:true});
          </script></body></html>
          HTML
      - name: Start fixture server
        run: |
          python3 -m http.server 8770 >/tmp/clubmatch-device-http.log 2>&1 &
          echo $! >/tmp/clubmatch-device-server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8770/_analyst-device-smoke.html >/dev/null && exit 0; sleep .1; done
          cat /tmp/clubmatch-device-http.log; exit 1
      - name: Real Chromium tablet 768x1024
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"; test -n "$CHROME" || exit 1
          rm -rf /tmp/clubmatch-tablet-profile
          timeout 25s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --user-data-dir=/tmp/clubmatch-tablet-profile --window-size=768,1024 --virtual-time-budget=6000 --run-all-compositor-stages-before-draw --dump-dom http://127.0.0.1:8770/_analyst-device-smoke.html >/tmp/clubmatch-tablet-dom.html 2>/tmp/clubmatch-tablet-chrome.log || { cat /tmp/clubmatch-tablet-chrome.log; exit 1; }
          for probe in 'data-laf-smoke="ok"' 'data-laf-stable="ok"' 'data-laf-goal-panel="ok"' 'data-laf-goal-saved="ok"' 'data-laf-workspace="ok"' 'data-laf-formation="ok"'; do grep -F "$probe" /tmp/clubmatch-tablet-dom.html >/dev/null || { echo "Tablet probe faalt: $probe"; cat /tmp/clubmatch-tablet-dom.html; exit 1; }; done
          grep -F 'data-laf-trail-current="0"' /tmp/clubmatch-tablet-dom.html >/dev/null || exit 1
          grep -F 'data-laf-trail-last="−30"' /tmp/clubmatch-tablet-dom.html >/dev/null || { echo 'Tablet historie bereikt −30 niet'; exit 1; }
          grep -F 'data-laf-trail-count="31"' /tmp/clubmatch-tablet-dom.html >/dev/null || exit 1
          grep -F 'Wai Sam' /tmp/clubmatch-tablet-dom.html >/dev/null || exit 1
          echo 'PASS tablet: Live Workspace zichtbaar + anti-flicker stable DOM + 0..−30 + Goal + formatie + gebeurtenissen'
      - name: Real Chromium desktop 1440x1000
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          rm -rf /tmp/clubmatch-desktop-profile
          timeout 25s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --user-data-dir=/tmp/clubmatch-desktop-profile --window-size=1440,1000 --virtual-time-budget=6000 --run-all-compositor-stages-before-draw --dump-dom http://127.0.0.1:8770/_analyst-device-smoke.html >/tmp/clubmatch-desktop-dom.html 2>/tmp/clubmatch-desktop-chrome.log || { cat /tmp/clubmatch-desktop-chrome.log; exit 1; }
          for probe in 'data-laf-smoke="ok"' 'data-laf-stable="ok"' 'data-laf-goal-panel="ok"' 'data-laf-goal-saved="ok"' 'data-laf-workspace="ok"' 'data-laf-formation="ok"'; do grep -F "$probe" /tmp/clubmatch-desktop-dom.html >/dev/null || { echo "Desktop probe faalt: $probe"; exit 1; }; done
          grep -F 'data-laf-trail-last="−30"' /tmp/clubmatch-desktop-dom.html >/dev/null || exit 1
          echo 'PASS desktop: Live Workspace + stable DOM + Goal + 0..−30 + formatie zonder browserhang'
      - name: Cleanup
        if: always()
        run: |
          kill "$(cat /tmp/clubmatch-device-server.pid 2>/dev/null)" 2>/dev/null || true
          rm -f _analyst-device-smoke.html
