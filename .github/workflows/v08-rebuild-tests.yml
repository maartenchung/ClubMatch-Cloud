name: ClubMatch v0.8 rebuild tests

on:
  push:
    branches:
      - clubmatch-v0.8-rebuild
    paths:
      - 'cloud-v0.8-rebuild/**'
      - '.github/workflows/v08-rebuild-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'cloud-v0.8-rebuild/**'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: cloud-v0.8-rebuild
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real Chromium cold-start smoke
        run: |
          python3 -m http.server 8765 >/tmp/clubmatch-http.log 2>&1 &
          SERVER_PID=$!
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'Geen Chromium/Chrome beschikbaar op runner'
            exit 1
          fi
          rm -rf /tmp/clubmatch-smoke-profile
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-component-update --disable-sync --no-first-run --user-data-dir=/tmp/clubmatch-smoke-profile --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8765/index.html >/tmp/clubmatch-dom.html 2>/tmp/clubmatch-chrome.log || {
            echo 'Chromium cold-start kon de DOM niet binnen 30s opleveren'
            cat /tmp/clubmatch-chrome.log
            cat /tmp/clubmatch-http.log
            exit 1
          }
          echo '--- ClubMatch browserstatus ---'
          grep -o 'id="v08Status"[^>]*>[^<]*' /tmp/clubmatch-dom.html | head -1 || true
          grep -F 'ClubMatch Cloud v0.8 gereed.' /tmp/clubmatch-dom.html || {
            echo 'ClubMatch bereikte in echte Chromium geen gereed-status'
            grep -o 'id="v08Status"[^>]*>[^<]*' /tmp/clubmatch-dom.html | head -1 || true
            grep -o 'id="v08BootStage"[^>]*>[^<]*' /tmp/clubmatch-dom.html | head -1 || true
            cat /tmp/clubmatch-chrome.log
            exit 1
          }
          grep -F 'id="authPanel" class="card"' /tmp/clubmatch-dom.html || {
            echo 'Uitgelogde cold-start gaf loginpaneel niet vrij nadat bootstrap gereed was'
            exit 1
          }
          if grep -F 'id="appPanel" class=""' /tmp/clubmatch-dom.html; then
            echo 'Uitgelogde cold-start mag app niet tonen'
            exit 1
          fi
          echo 'PASS echte Chromium cold-start: volledige shell bereikt gereed-status en toont daarna pas Inloggen'
      - name: Real Chromium persisted-session smoke
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || exit 1
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          marker='<script src="'
          inject='''<script>\nlocalStorage.setItem('clubmatch-v08-session',JSON.stringify({access_token:'fake-access',refresh_token:'fake-refresh',expires_at:4102444800,user:{id:'test-user',email:'test@example.com'}}));\nwindow.fetch=async function(input,init={}){const u=String(input);const json=(v,s=200)=>Promise.resolve(new Response(JSON.stringify(v),{status:s,headers:{'Content-Type':'application/json'}}));if(u.includes('/auth/v1/user'))return json({id:'test-user',email:'test@example.com',factors:[]});if(u.includes('/rest/v1/rpc/get_my_team_seasons'))return json([]);if(u.includes('/rest/v1/rpc/get_my_open_matches'))return json([{match_id:'match-smoke',team_name:'O16-1',opponent_name:'Smoke FC',club_name:'Hercules',match_date:'2026-08-29',scheduled_time:'00:00',status:'live',state_version:7}]);if(u.includes('/rest/v1/rpc/'))return json([]);return json({});};\ndocument.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{const b=document.getElementById('refreshMatchesBtn');if(b&&typeof b.click==='function')b.click();setTimeout(()=>document.documentElement.setAttribute('data-cm-click-probe','ok'),250)},1200),{once:true});\n</script>\n'''
          idx=html.find(marker)
          if idx<0: raise SystemExit('geen extern script gevonden')
          Path('_persisted-session-smoke.html').write_text(html[:idx]+inject+html[idx:],encoding='utf-8')
          PY
          python3 -m http.server 8766 >/tmp/clubmatch-persisted-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; rm -f _persisted-session-smoke.html' EXIT
          rm -rf /tmp/clubmatch-persisted-profile
          timeout 20s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-component-update --disable-sync --no-first-run --user-data-dir=/tmp/clubmatch-persisted-profile --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8766/_persisted-session-smoke.html >/tmp/clubmatch-persisted-dom.html 2>/tmp/clubmatch-persisted-chrome.log || {
            echo 'FAIL persisted-session: browserthread kwam niet vrij'
            cat /tmp/clubmatch-persisted-chrome.log
            exit 1
          }
          echo '--- Persisted-session browserstatus ---'
          STATUS="$(grep -o 'id="v08Status"[^>]*>[^<]*' /tmp/clubmatch-persisted-dom.html | head -1 || true)"
          echo "$STATUS"
          grep -F 'test@example.com' /tmp/clubmatch-persisted-dom.html >/dev/null || { echo 'Sessiegebruiker werd niet hersteld'; exit 1; }
          grep -F 'id="appPanel" class=""' /tmp/clubmatch-persisted-dom.html >/dev/null || { echo 'Geldige opgeslagen sessie gaf app niet vrij'; exit 1; }
          grep -F 'Smoke FC' /tmp/clubmatch-persisted-dom.html >/dev/null || { echo 'Open wedstrijdkaart werd niet opgebouwd'; exit 1; }
          grep -F 'data-cm-click-probe="ok"' /tmp/clubmatch-persisted-dom.html >/dev/null || { echo 'FAIL: browser event-loop reageerde niet op knopklik/timer'; exit 1; }
          if printf '%s' "$STATUS" | grep -F 'Opgeslagen sessie controleren' >/dev/null; then echo 'Sessiestatus bleef hangen'; exit 1; fi
          echo 'PASS echte Chromium persisted-session: sessie + wedstrijdkaart + klikrespons blijven vrij'
      - name: Browser shell syntax
        run: |
          node --check app.js
          node --check cloud-client.js
          node --check realtime-native.js
          node --check realtime-status-ui.js
          node --check pitch-layout.js
          node --check event-describer.js
          node --check action-field-event-describer.js
          node --check live-input-event-describer-v08.js
          node --check action-field-controller.js
          node --check action-field-ui.js
          node --check action-field-standalone.js
          node --check smart-registration-v08.js
          node --check analyst-live-input-v08.js
          node --check goal-types-ux-v08.js
          node --check device-security-ux-v08.js
          node --check fast-resume-v08.js
          node --check event-feed-ui.js
          node --check live-notice-ui.js
          node --check roadmap-ux-v08.js
          node --check v08-stabilization.js
          node --check live-state.js
          node --check snapshot-adapter.js
          node --check view-model.js
          node --check mutation-controller.js
          node --check clock-projector.js
          node --check runtime.js
          node --check ui-frame.js
          node --check dom-renderer.js
          node --check action-policy.js
          node --check lifecycle-sync.js
          node --check match-selection.js
          node --check formation-layout.js
          node --check preparation-controller.js
          node --check preparation-ui.js
          node --check correction-ui.js
          node --check basis-lineup-ui.js
          node --check live-pitch-controller.js
          node --check match-phase-controller.js
          node --check match-phase-ui.js
          node --check live-controls-ui.js
          node --check player-action-controller.js
          node --check player-action-ui.js
          node --check voice-command.js
          node --check voice-controller.js
          node --check voice-ui.js
          node --check dashboard-controller.js
          node --check dashboard-ui.js
          node --check match-library-ui.js
          node --check management-controller.js
          node --check management-ui.js
          node --check management-visibility.js
          node --check training-controller.js
          node --check training-ui.js
          node --check stored-match-delete-ui.js
          node --check security-controller.js
          node --check security-ui.js
          node --check ux-theme.js
      - name: Version-pinned browser assets
        run: node asset-versioning.test.mjs
      - name: Live UX fixes contract
        run: node live-ux-fixes.test.mjs
      - name: Analyst touch field and visible events
        run: node analyst-live-input.test.mjs
      - name: Smart player-bound quick registration
        run: node smart-registration.test.mjs
      - name: Confirmed Cloud Fast Resume
        run: node fast-resume.test.mjs
      - name: Shared browser Cloud client
        run: node shared-cloud-client.test.mjs
      - name: GitHub Pages password recovery redirect
        run: grep -F "const RESET_REDIRECT='https://maartenchung.github.io/ClubMatch-Cloud/cloud-v0.8-rebuild/';" app.js
      - name: Native Cloud transport, recovery and MFA
        run: node cloud-client.test.mjs
      - name: Native Realtime Postgres Changes transport
        run: node realtime-native.test.mjs
      - name: Password recovery and MFA security controller
        run: node security-controller.test.mjs
      - name: Password recovery live validation UI
        run: node security-ui.test.mjs
      - name: Action availability policy
        run: node action-policy.test.mjs
      - name: Match pause and halftime clocks
        run: node clock-projector.test.mjs
      - name: Mobile and desktop lifecycle resync
        run: node lifecycle-sync.test.mjs
      - name: Active match refresh restore
        run: node match-selection.test.mjs
      - name: Formation presets and starter assignment
        run: node formation-layout.test.mjs
      - name: Match preparation and start gate
        run: node preparation-controller.test.mjs
      - name: Append-only event correction projection
        run: node correction-ui.test.mjs
      - name: Direct correction UI integration
        run: node correction-integration.test.mjs
      - name: Dutch live event descriptions and monitoring changes
        run: node event-describer.test.mjs
      - name: Goal and penalty score event timeline
        run: node event-score.test.mjs
      - name: Live clock controls placement and finish confirmation
        run: node live-controls-integration.test.mjs
      - name: Confirmed quick player action controller
        run: node player-action-controller.test.mjs
      - name: Quick player action app integration
        run: node player-action-integration.test.mjs
      - name: Live UX possession phase and permissions
        run: node live-ux-roadmap.test.mjs
      - name: Action field gesture controller
        run: node action-field-controller.test.mjs
      - name: Action field UI timeline and Cloud integration
        run: node action-field-integration.test.mjs
      - name: Dutch voice commands by name shirt number and player action
        run: node voice-command.test.mjs
      - name: Voice proposal and explicit confirmation gate
        run: node voice-controller.test.mjs
      - name: Restart-safe browser speech sessions
        run: node voice-ui-restart.test.mjs
      - name: Confirmed-snapshot voice app integration
        run: node voice-integration.test.mjs
      - name: Dashboard match selection delete and 1-100 rating
        run: node dashboard-controller.test.mjs
      - name: Saved preparations and match history
        run: node match-library-ui.test.mjs
      - name: Training attendance and one-click assessment save
        run: node training-controller.test.mjs
      - name: Reopen and resume saved trainings
        run: node training-reopen.test.mjs
      - name: Isolated Trainingen workspace
        run: node training-workspace.test.mjs
      - name: Team season player and club management controller
        run: node management-controller.test.mjs
      - name: Roadmap parity browser integration
        run: node roadmap-parity-integration.test.mjs
      - name: Mutation controller and lifecycle gates
        run: node mutation-controller.test.mjs
      - name: Snapshot adapter
        run: node snapshot-adapter.test.mjs
      - name: Shared live view model
        run: node view-model.test.mjs
      - name: Confirmed-state runtime
        run: node runtime.test.mjs
      - name: Match regression gates 1-17
        run: node regression-gates.test.mjs
      - name: Single-source UI frame
        run: node ui-frame.test.mjs
