name: ClubMatch v0.8 browser isolation
on:
  push:
    branches: [clubmatch-v0.8-rebuild]
    paths:
      - 'cloud-v0.8-rebuild/**'
      - '.github/workflows/v08-browser-isolation.yml'
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: cloud-v0.8-rebuild
    steps:
      - uses: actions/checkout@v4
      - name: Chromium prefix isolation
        run: |
          set +e
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || exit 2
          python3 -m http.server 8766 >/tmp/cm-prefix-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; rm -f _cm-prefix-*.html' EXIT
          sleep 0.5
          for N in 0 1 10 20 30 35 40 45 50 52 54 55 56 57 80; do
            N="$N" python3 - <<'PY'
          import os,re
          n=int(os.environ['N'])
          html=open('index.html',encoding='utf-8').read()
          seen=0
          def keep(m):
              global seen
              seen+=1
              return m.group(0) if seen<=n else ''
          html=re.sub(r'<script\s+src="[^"]+"[^>]*></script>',keep,html)
          open(f'_cm-prefix-{n}.html','w',encoding='utf-8').write(html)
          PY
            rm -rf "/tmp/cm-profile-$N"
            timeout 7s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-component-update --disable-sync --no-first-run --user-data-dir="/tmp/cm-profile-$N" --virtual-time-budget=2000 --dump-dom "http://127.0.0.1:8766/_cm-prefix-$N.html" >"/tmp/cm-$N.dom" 2>"/tmp/cm-$N.log"
            RC=$?
            STATUS="$(grep -o 'id="v08Status"[^>]*>[^<]*' "/tmp/cm-$N.dom" | head -1)"
            echo "PREFIX=$N RC=$RC STATUS=$STATUS"
          done
          exit 0
