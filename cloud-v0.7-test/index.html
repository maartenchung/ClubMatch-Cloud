<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ClubMatch Cloud v0.7.2 laden…</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#241633;background:#f6f1fb}
body{margin:0;padding:24px}.box{max-width:680px;margin:40px auto;background:#fff;border:1px solid #eadcf5;border-radius:16px;padding:20px;box-shadow:0 4px 18px rgba(93,46,132,.12)}
h1{color:#4b2672;margin-top:0}.status{padding:12px;border-radius:10px;background:#f1e9f8;border:1px solid #e4d4f2;white-space:pre-wrap}.err{background:#fff4db;border-color:#ead6a6;color:#6a531c}
</style>
</head>
<body>
<div class="box"><h1>ClubMatch Cloud v0.7.2</h1><div id="status" class="status">v0.7.2 Live Stint & Wisselstatus laden…</div></div>
<script>
(async()=>{
 const s=document.getElementById('status');
 try{
  if(!('DecompressionStream' in window))throw new Error('Gebruik een actuele Chrome, Edge of Safari.');
  const base='../cloud-v0.6-test/';
  const names=['payload01.txt','payload02.txt','payload03.txt'];
  const parts=await Promise.all(names.map(async n=>{const r=await fetch(base+n+'?v=0720',{cache:'no-store'});if(!r.ok)throw new Error(n+' kon niet worden geladen (HTTP '+r.status+').');return r.text()}));
  const b64=parts.join('').replace(/\s+/g,'');
  if(b64.length!==47004)throw new Error('Payloadlengte klopt niet: '+b64.length+'.');
  const bin=atob(b64),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0)),ds=new DecompressionStream('gzip');
  let html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  if(!html.includes("CLOUD_BRIDGE_VERSION='0.6'"))throw new Error('Onverwachte basisbuild.');

  const redirectUrl='https://maartenchung.github.io/Hercules-O16/cloud-v0.7-test/';
  html=html.replace("options:{data:{full_name:'ClubMatch beheerder'}}","options:{emailRedirectTo:'"+redirectUrl+"',data:{full_name:'ClubMatch beheerder'}}");
  html=html.replace("const CLOUD_BRIDGE_VERSION='0.6';","const CLOUD_BRIDGE_VERSION='0.7.2';");
  html=html.replace('Cloud v0.6 · apparaat-sync + diagnostiek + Cloud dashboard','Cloud v0.7.2 · live stint-tijden + wisselstatus + rijk dashboard');
  html=html.replace('v0.6 controleert elke 5 seconden','v0.7.2 controleert elke 5 seconden');
  html=html.replace('v0.6.1 controleert elke 5 seconden','v0.7.2 controleert elke 5 seconden');

  html=html.replace(
   "  const stored=localStorage.getItem('clubmatch_cloud_active_match_v1');\n  if(stored&&cloudOpenMatches.some(x=>x.match_id===stored))cloudActiveMatchId=stored;",
   "  cloudActiveMatchId=null;\n  cloudLastSnapshotVersion=null;\n  cloudLastDraftStamp=null;"
  );

  html=html.replace('function cloudApplyLiveSnapshot(snap){',
`function cloudPauseInfoFromEvents(events,serverNowIso){
  const nowMs=Date.parse(serverNowIso||new Date().toISOString());
  const sorted=(events||[]).slice().sort((a,b)=>Date.parse(a.occurred_at||0)-Date.parse(b.occurred_at||0));
  let totalMs=0,openStart=null;
  for(const e of sorted){
    const t=Date.parse(e.occurred_at||0);if(!Number.isFinite(t))continue;
    if(e.event_type==='match_paused'||e.event_type==='halftime_started'){if(openStart===null)openStart=t}
    else if(e.event_type==='match_resumed'||e.event_type==='second_half_started'||e.event_type==='match_finished'){if(openStart!==null){totalMs+=Math.max(0,t-openStart);openStart=null}}
  }
  if(openStart!==null)totalMs+=Math.max(0,nowMs-openStart);
  return {totalMs,open:openStart!==null};
}
function cloudApplyLiveSnapshot(snap){`);
  html=html.replace("  const effective=Math.max(0,Number(ms.effective_elapsed_seconds)||0);","  const effective=Math.max(0,Number(ms.effective_elapsed_seconds)||0);\n  const cloudPause=cloudPauseInfoFromEvents(events,snap.server_now);");
  html=html.replace(
   "    paused:ms.clock_status!=='running',pausedAt:ms.clock_status!=='running'?Date.now():null,pausedTotalMs:0,",
   "    paused:ms.clock_status!=='running',pausedAt:ms.clock_status!=='running'?Date.now():null,pausedTotalMs:0,\n    cloudPauseTotalMs:cloudPause.totalMs,cloudPauseOpen:cloudPause.open,cloudPauseLoadedAtMs:Date.now(),"
  );
  html=html.replace('function rawActiveMs(){',
`function cloudPauseMsNow(){
  if(!state?.cloud)return state?.pausedTotalMs||0;
  const base=Number(state.cloudPauseTotalMs)||0;
  return state.cloudPauseOpen?base+Math.max(0,Date.now()-(Number(state.cloudPauseLoadedAtMs)||Date.now())):base;
}
function rawActiveMs(){`);
  html=html.replace(
`function livePauseMs(){
  const current=(state.paused&&state.pausedAt&&!state.autoStopped)?Date.now()-state.pausedAt:0;
  return Math.max(0,(state.pausedTotalMs||0)+current);
}`,
`function livePauseMs(){
  if(state.cloud)return Math.max(0,cloudPauseMsNow());
  const current=(state.paused&&state.pausedAt&&!state.autoStopped)?Date.now()-state.pausedAt:0;
  return Math.max(0,(state.pausedTotalMs||0)+current);
}`);

  const scripts=[
    '../cloud-v0.6-test/v064-stablerender.js?v=0720',
    'v070-clock.js?v=0720',
    'prepfix.js?v=0720',
    'v070-ui.js?v=0720',
    'v071-ui.js?v=0720',
    'v072-ui.js?v=0720'
  ].map(src=>'<scr'+'ipt src="'+src+'"></scr'+'ipt>').join('');
  html=html.replace('</body>',scripts+'</body>');
  document.open();document.write(html);document.close();
 }catch(e){s.classList.add('err');s.textContent='Laden mislukt: '+e.message}
})();
</script>
</body>
</html>
